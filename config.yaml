market_truth:
  minimum_quorum: 2
  max_source_age_seconds: 20
  freshness_half_life_seconds: 5
  latency_scale_ms: 1000
  outlier_threshold_bps: 150
  usd_equivalent_quotes: [USD, USDC, USDT]
  quote_normalization: none
  poll_interval_seconds: 5
  deep_refresh_seconds: 15

market_catalog:
  refresh_interval_seconds: 900
  max_age_seconds: 1800
  minimum_quote_turnover_24h: 1000000
  maximum_spread_bps: 50
  max_exchange_timestamp_age_seconds: 180
  exchange_timestamp_future_tolerance_seconds: 5
  allowed_quote_assets: [USD, USDT, USDC]
  excluded_base_assets: [USD, USDT, USDC, BUSD, FDUSD, TUSD, DAI, EUR, GBP]

# Descriptive Phase 7B observations for the exact venue instruments in the
# selected deep watchlist. This path is independent of the SOL/HYPE ensemble.
market_analysis:
  enabled: true
  intervals: [5m, 15m, 1h, 4h]
  poll_interval_seconds: 15
  instruments_per_cycle: 5
  history_candles: 80
  minimum_history: 25
  maximum_cached_candles: 10000
  maximum_requests_per_cycle: 30
  candle_stale_seconds: 1800
  book_stale_seconds: 60
  derivatives_ttl_seconds: 60
  # Immutable five-minute snapshots and bounded point-in-time observation only.
  observation_cadence_seconds: 300
  outcome_max_latency_seconds: 60
  outcome_requests_per_cycle: 8
  shadow_monitor_requests_per_cycle: 2
  fee_bps_per_side: 4.0
  slippage_bps_per_side: 2.0
  feature_version: descriptive-v1

# Phase 08: bounded virtual, spot-only experiment. These are unvalidated
# research choices; no order placement or predictive promotion is enabled.
strategy_shadow:
  initial_equity: 10000
  allowed_quotes: [USD, USDT]
  risk_fraction: 0.001
  max_total_risk_fraction: 0.01
  max_notional: 250
  entry_ttl_seconds: 60
  maximum_holding_seconds: 3600
  cooldown_seconds: 900
  max_bbo_age_seconds: 30
  max_entry_spread_bps: 30
  fee_bps_per_side: 4
  slippage_bps_per_side: 2

