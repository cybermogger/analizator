service:
  analysis_interval_seconds: 45
  cycle_timeout_seconds: 60
  request_timeout_seconds: 8
  max_retries: 4
  history_candles: 350
  minimum_candles: 220
  health_interval_hours: 4
  log_level: INFO
  log_max_bytes: 10000000
  log_backup_count: 5

mini_app:
  enabled: true
  host: 127.0.0.1
  port: 8080
  public_url: null
  allowed_user_ids: []
  init_data_max_age_seconds: 300

dashboard:
  enabled: true
  host: 127.0.0.1
  port: 8081

market:
  assets: [SOL, HYPE]
  context_asset: BTC
  timeframes: [1m, 5m, 15m, 30m, 1h, 4h]
  timeframe_weights:
    1m: 0.05
    5m: 0.15
    15m: 0.25
    30m: 0.15
    1h: 0.25
    4h: 0.15

providers:
  hyperliquid:
    kind: hyperliquid
    enabled: true
    rest_url: https://api.hyperliquid.xyz/info
    websocket_url: wss://api.hyperliquid.xyz/ws
    request_timeout_seconds: 8
    max_retries: 4
    max_subscriptions: 120
    max_concurrent_requests: 4
    minimum_request_interval_ms: 100
    stale_after_seconds: 30
  binance:
    kind: binance
    enabled: true
    spot_rest_url: https://data-api.binance.vision
    futures_rest_url: https://fapi.binance.com
    spot_websocket_url: wss://stream.binance.com:9443/ws
    futures_websocket_url: wss://fstream.binance.com/ws
    request_timeout_seconds: 8
    max_subscriptions: 1024
    max_concurrent_requests: 4
    minimum_request_interval_ms: 100
    stale_after_seconds: 30
  coinbase:
    kind: coinbase
    enabled: true
    rest_url: https://api.coinbase.com
    websocket_url: wss://advanced-trade-ws.coinbase.com
    request_timeout_seconds: 8
    max_subscriptions: 300
    max_concurrent_requests: 4
    minimum_request_interval_ms: 100
    stale_after_seconds: 30
    catalog_page_size: 250
    catalog_max_pages: 20
    catalog_page_delay_seconds: 0.15
    bbo_enrichment_limit: 10
  kraken:
    kind: kraken
    enabled: true
    rest_url: https://api.kraken.com
    websocket_url: wss://ws.kraken.com/v2
    request_timeout_seconds: 8
    max_subscriptions: 200
    max_concurrent_requests: 4
    minimum_request_interval_ms: 100
    stale_after_seconds: 30

