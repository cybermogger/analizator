storage:
  sqlite_path: data/analyzer.db
  raw_path: data/raw
  models_path: models
  logs_path: logs
  raw_rotation_minutes: 60
  raw_retention_days: 7

models:
  horizons:
    15m:
      source_interval: 5m
      steps: 3
    1h:
      source_interval: 15m
      steps: 4
    4h:
      source_interval: 1h
      steps: 4
  min_training_samples: 500
  min_class_samples: 30
  min_balanced_accuracy: 0.36
  max_brier_score: 0.75
  min_brier_skill: 0.0
  barrier_atr_multiplier: 1.25
  walk_forward_splits: 3
  random_state: 42
  auto_retrain:
    enabled: false
    interval_hours: 24
    timeout_seconds: 900

ensemble:
  base_weights:
    technical: 0.25
    structure: 0.05
    derivatives: 0.00
    orderbook: 0.00
    tradeflow: 0.00
    statistical: 0.23
    ml: 0.40
    btc_context: 0.07
  warming_prior: [0.24, 0.24, 0.52]

signal_quality:
  max_data_age_seconds: 180
  volatility_spike_ratio: 2.0
  fast_flow_imbalance: 0.65
  btc_shock_return: 0.025

forecast_performance:
  minimum_samples: 100
  regularization_samples: 300
  weight_multiplier_bounds: [0.8, 1.2]
  max_weight_adjustment: 0.15
  overconfidence_tolerance: 0.05
  max_wait_shift: 0.20

research:
  # Offline-only Phase 4 protocol. This section is not read by the live signal path.
  horizons: [5m, 15m, 1h, 4h, 24h]
  walk_forward_folds: 3
  untouched_test_fraction: 0.20
  embargo_seconds: 300
  minimum_train_rows: 500
  minimum_partition_rows: 50
  top_k: 3
  requested_notional_usd: 1000
  threshold_candidates: [0.45, 0.50, 0.55, 0.60, 0.65, 0.70]
  regularization_candidates: [0.1, 1.0]
  random_state: 42
  ranking_gates:
    minimum_predicted_net_return: 0.0
    minimum_exit_feasibility_probability: 0.60
    maximum_predicted_adverse_excursion: 0.05
    maximum_predicted_volatility: 0.20
  promotion:
    minimum_test_samples: 200
    minimum_trades: 30
    minimum_time_blocks: 3
    maximum_drawdown: 0.20
    maximum_ece: 0.10
    require_all_blocks_positive: true
  execution_costs:
    entry_fee_bps: 4.0
    exit_fee_bps: 4.0
    round_trip_spread_bps: 4.0
    round_trip_slippage_bps: 8.0
    latency_bps: 2.0
    funding_bps: 0.0
    impact_bps: 2.0
    maximum_liquidity_participation: 0.05
    minimum_fill_fraction: 0.25

paper:
  # Phase 5 is deliberately shadow-only. Any other mode is rejected at startup.
  shadow_mode: true
  initial_equity_usd: 100000
  major_risk_fraction: 0.0025
  memecoin_risk_fraction: 0.0005
  daily_loss_limit_fraction: 0.015
  maximum_paper_risk_usd: 1000
  maximum_gross_exposure_fraction: 0.50
  maximum_cluster_exposure_fraction: 0.15
  maximum_concurrent_positions: 8
  maximum_liquidity_participation: 0.01
  minimum_liquidity_usd: 25000
  minimum_exit_feasibility_probability: 0.60
  maximum_data_age_seconds: 180
  maximum_venue_divergence_bps: 150
  maximum_predicted_volatility: 0.20
  maximum_predicted_mae: 0.05
  minimum_calibrated_probability: 0.50
  volatility_risk_multiplier: 1.0
  maximum_gap_bps: 500
  cooldown_seconds: 900
  recommendation_ttl_seconds: 1800
  entry_fee_bps: 4
  exit_fee_bps: 4
  liquidity_loss_fraction: 0.50
  model_drift_min_samples: 100
  model_drift_min_balanced_accuracy: 0.30
  model_drift_max_brier: 0.75
  model_drift_max_ece: 0.15
