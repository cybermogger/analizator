  - {instrument_id: binance:perpetual:SOL-USDT, canonical_asset_id: native:solana, provider: binance, venue: binance-usdm, market_type: perpetual, base: SOL, quote: USDT, venue_symbol: SOLUSDT, price_decimals: 4, size_decimals: 2}
  - {instrument_id: binance:spot:BTC-USDT, canonical_asset_id: native:bitcoin, provider: binance, venue: binance-spot, market_type: spot, base: BTC, quote: USDT, venue_symbol: BTCUSDT, price_decimals: 2, size_decimals: 5}
  - {instrument_id: binance:perpetual:BTC-USDT, canonical_asset_id: native:bitcoin, provider: binance, venue: binance-usdm, market_type: perpetual, base: BTC, quote: USDT, venue_symbol: BTCUSDT, price_decimals: 2, size_decimals: 5}
  - {instrument_id: coinbase:spot:SOL-USD, canonical_asset_id: native:solana, provider: coinbase, venue: coinbase-advanced, market_type: spot, base: SOL, quote: USD, venue_symbol: SOL-USD, price_decimals: 4, size_decimals: 3}
  - {instrument_id: coinbase:spot:BTC-USD, canonical_asset_id: native:bitcoin, provider: coinbase, venue: coinbase-advanced, market_type: spot, base: BTC, quote: USD, venue_symbol: BTC-USD, price_decimals: 2, size_decimals: 8}
