[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperliquid-analyzer"
version = "1.0.0"
description = "Read-only multi-venue crypto market intelligence with Hyperliquid SOL/HYPE signals"
requires-python = ">=3.11"
dependencies = [
  "ctranslate2>=4.6,<5", "sentencepiece>=0.2,<0.3",
  "aiohttp>=3.11,<4", "websockets>=14,<16", "numpy>=2.1,<3",
  "pandas>=2.2,<3", "scipy>=1.14,<2", "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2", "PyYAML>=6.0,<7", "python-dotenv>=1.0,<2",
  "pyarrow>=18,<24", "structlog>=24.4,<26"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
timeout = 30
timeout_method = "thread"
markers = ["integration: live network test; never part of tests/"]
